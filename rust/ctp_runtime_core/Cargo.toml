[package]
name = "ctp_runtime_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Platform-neutral Rust runtime core for CTP adapters."

[lib]
name = "ctp_native"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = []

[dependencies]
serde = { version = "1", features = ["derive"] }

[build-dependencies]
cc = "1.2"
