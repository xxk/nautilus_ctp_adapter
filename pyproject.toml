[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "nautilus-ctp-adapter"
version = "0.1.0"
description = "Standalone CTP adapter workspace for Nautilus integration."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Codex" },
]
dependencies = []

[project.optional-dependencies]
nautilus = ["nautilus_trader>=1.200"]
dev = ["pytest>=8,<9"]

[tool.maturin]
# Python packages under src/ are included alongside the Rust extension module.
python-source = "src"
# Build the PyO3 bridge crate.
manifest-path = "rust/ctp_py/Cargo.toml"
# Install extension as ctp_runtime/_ctp_runtime.pyd (pydantic-core convention).
module-name = "ctp_runtime._ctp_runtime"

[tool.pytest.ini_options]
testpaths = ["tests"]

